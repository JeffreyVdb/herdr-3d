query ClosedIssuesPage($closedQuery:String!, $after:String!, $statusField:String!) {
  recentClosedIssues: search(type:ISSUE, query:$closedQuery, first:100, after:$after) {
    issueCount pageInfo { hasNextPage endCursor }
    nodes { ... on Issue { ...IssueCard } }
  }
  rateLimit { cost limit remaining resetAt }
}
fragment IssueCard on Issue {
  id number title state stateReason url
  labels(first:100) { pageInfo { hasNextPage endCursor } nodes { name color } }
  assignees(first:100) { pageInfo { hasNextPage endCursor } nodes { login avatarUrl } }
  author { login avatarUrl }
  createdAt updatedAt closedAt
  projectItems(first:100) {
    pageInfo { hasNextPage endCursor }
    nodes { id project { id number title } fieldValueByName(name:$statusField) { ... on ProjectV2ItemFieldSingleSelectValue { name optionId } } }
  }
}
