  <rect width="512" height="512" fill="#1c2540"/>
  <rect x="0" y="392" width="512" height="120" fill="#4e8f45"/>
  <!-- roof sign -->
  <rect x="172" y="86" width="168" height="52" rx="10" fill="#f6f3ec"/>
  <rect x="196" y="104" width="120" height="16" rx="8" fill="#1c2540"/>
  <!-- building -->
  <rect x="110" y="138" width="292" height="254" rx="10" fill="#e8a595"/>
  <rect x="110" y="138" width="292" height="26" rx="10" fill="#f2c2b5"/>
  <rect x="134" y="176" width="244" height="92" rx="6" fill="#3a2f45"/>
  <rect x="134" y="284" width="244" height="92" rx="6" fill="#3a2f45"/>
