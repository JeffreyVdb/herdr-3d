  <g fill="#ffc233">
    <circle cx="176" cy="212" r="15"/><circle cx="256" cy="212" r="15"/><circle cx="336" cy="212" r="15"/>
  </g>
  <g fill="#bcc7d6">
    <rect x="152" y="234" width="48" height="12" rx="4"/><rect x="232" y="234" width="48" height="12" rx="4"/><rect x="312" y="234" width="48" height="12" rx="4"/>
  </g>
  <!-- bottom floor -->
  <g fill="#7fd1c4">
    <circle cx="176" cy="320" r="15"/><circle cx="336" cy="320" r="15"/>
  </g>
  <g fill="#bcc7d6">
    <rect x="152" y="342" width="48" height="12" rx="4"/><rect x="312" y="342" width="48" height="12" rx="4"/>
  </g>
  <rect x="240" y="322" width="32" height="54" rx="5" fill="#f6f3ec"/>
