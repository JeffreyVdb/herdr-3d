<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>herdr-3d</title>
    <meta name="theme-color" content="#1c2540" />
    <script>
      /* #216: the saved UI theme, on the root before the first frame (src/ui/themeLoader.ts keeps it afterwards): a saved
         Ubuntu never shows navy chrome first. Same key and values as src/ui/uiTheme.ts; storage may be missing or throw. */
      (function () {
        try {
          if (localStorage.getItem('h3d.theme.ui') === 'ubuntu') {
            document.documentElement.setAttribute('data-ui-theme', 'ubuntu');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#2c001e');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd6ff; }
      canvas { display: block; }
      /* Renderer backend, for the e2e specs and a start-up failure. Hidden otherwise: the About panel shows it. */
      #debug {
        display: none;
        position: fixed; bottom: 8px; left: 8px; padding: 3px 7px; z-index: 5;
        font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #fff; background: rgb(28 37 64 / 70%); border-radius: 4px;
        pointer-events: none;
      }
      #debug.error { display: block; background: #b45309; }
    </style>
  </head>
  <body>
    <div id="debug">backend: …</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
