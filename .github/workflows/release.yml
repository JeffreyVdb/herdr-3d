name: release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-rc.1` for a prerelease) from main to publish
# a release: the bridge for Linux, the Mac helper with the game embedded, and
# SHA256SUMS. `deploy/h3d-update` on the server installs it. docs/releasing.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build the release for"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The commit the tag names, checked once: every other job checks out this
  # exact SHA, and publish refuses a tag that moved since.
  tag:
    runs-on: ubuntu-26.04-arm
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Tag must be vX.Y.Z[-suffix] and on main
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH[-suffix]"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }

      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # The same checks as ci.yml, side by side: a release never ships what CI
  # would reject.
  go:
    needs: tag
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # ci.yml's cache, restored only (main's latest).
      - uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - run: make go-lint
      - run: make go-test
      - run: make go-build helper-darwin

  game:
    needs: tag
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
      # pnpm version comes from game/package.json "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: game/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: game/.nvmrc
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: make game-lint
      - run: make game-test

  shell:
    needs: tag
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
      - run: make sh-test

  # Builds and publishes only once every check passed. x64, so the version
  # check below runs the very linux-amd64 binary that ships.
  publish:
    needs: [tag, go, game, shell]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    env:
      SHA: ${{ needs.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.sha }}
          fetch-depth: 0

      - name: Tag still names the checked commit
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          [ "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$SHA" ] \
            || { echo "::error::$TAG moved off $SHA while the release was checked"; exit 1; }

      # No build cache: CI saves arm64 ones only, and a release builds from
      # scratch rarely enough.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: game/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: game/.nvmrc
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml

      # release-assets builds the game first and embeds it in the helper.
      - name: Build assets
        run: make release-assets VERSION="$TAG"

      - name: Built versions are the tag
        run: |
          ./bin/release/herdr-world-linux-amd64 --version | grep -qx "herdr-world $TAG" \
            || { echo "::error::bridge binary does not report $TAG"; exit 1; }
          cd bin/release && sha256sum -c SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--verify-tag --generate-notes --title "$TAG")
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" bin/release/* --clobber
          else
            # A draft until every asset is up, so "latest" never points at a partial release.
            gh release create "$TAG" bin/release/* "${flags[@]}" --draft
            gh release edit "$TAG" --draft=false
          fi
