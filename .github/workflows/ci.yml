name: ci

on:
  push:
    branches: ["**"] # tags are built by release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the go and game jobs run. A push to any branch other than
  # main runs each only when the branch changes one of its inputs, compared
  # against main (not the previous push, so a docs-only push on a branch that
  # already changed Go code still runs it). Pushes to main and manual runs
  # always run both.
  changes:
    runs-on: ubuntu-26.04-arm
    outputs:
      go: ${{ steps.filter.outputs.go }}
      game: ${{ steps.filter.outputs.game }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          # cmd/ and internal/ hold the Go code and what it embeds or reads (testdata,
          # catalog.json, pricing.json, graphql queries); game/fixtures/ is read by Go tests.
          GO_INPUTS: '^(cmd|internal|game/fixtures)/|^(go\.mod|go\.sum|Makefile|\.github/workflows/ci\.yml)$'
          # game/ is the app and its tests; the tests also read docs/shortcuts.md
          # (the generated shortcuts table) and the Go whiteboard testdata.
          GAME_INPUTS: '^(game|internal/whiteboard/testdata|internal/notify/testdata|internal/childagents/testdata)/|^(docs/shortcuts\.md|Makefile|\.github/workflows/ci\.yml)$'
        run: |
          if [ "$EVENT" != push ] || [ "$REF_NAME" = main ]; then
            go=true
            game=true
          else
            files=$(git diff --no-renames --name-only origin/main...HEAD)
            if grep -Eq "$GO_INPUTS" <<< "$files"; then go=true; else go=false; fi
            if grep -Eq "$GAME_INPUTS" <<< "$files"; then game=true; else game=false; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "game=$game" >> "$GITHUB_OUTPUT"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      # setup-go's own cache is keyed on go.sum only and never saved again
      # after a hit, so its build cache aged with every commit (the trimmed
      # linux build and the darwin helper recompiled modernc sqlite each run).
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - id: go-env
        run: |
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          echo "mod=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
      # The latest cache of this platform (main's, or this branch's own) is
      # restored; it is saved by main and by manual runs only, so branch
      # pushes do not churn the repository's cache space. Go trims build cache
      # entries unused for five days.
      - id: go-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'Makefile', 'cmd/**/*.go', 'internal/**/*.go') }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-
      - run: make go-lint
      - run: make go-test
      - run: make go-build helper-darwin
      - if: steps.go-cache.outputs.cache-hit != 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.go-env.outputs.build }}
            ${{ steps.go-env.outputs.mod }}
          key: ${{ steps.go-cache.outputs.cache-primary-key }}

  # Shell only (shellcheck + the fake-environment deploy test), so it runs on every push.
  shell:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@v7
      - run: make sh-test

  game:
    needs: changes
    if: needs.changes.outputs.game == 'true'
    runs-on: ubuntu-26.04-arm
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from game/package.json "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: game/package.json
      - uses: actions/setup-node@v7
        with:
          node-version-file: game/.nvmrc
          cache: pnpm
          cache-dependency-path: game/pnpm-lock.yaml
      - run: make game-lint
      - run: make game-test
