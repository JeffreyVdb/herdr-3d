# Synthetic, token-shaped test values for the prompt-secret detector (#108): the Gitleaks parity corpus, the detector's
# and the bridge's tests, the game's fixture bridge and e2e, and the research corpora. None is a real credential.
paths-ignore:
  - "tools/secretrules/testdata/**"
  - "internal/promptsecret/**"
  - "internal/server/promptsecret*_test.go"
  - "internal/secretfiles/**/*_test.go"
  - "game/tools/fixture-secrets*.ts"
  - "game/src/**/*secret*.test.ts"
  - "game/e2e/h108-*.spec.ts"
  - "docs/research/prompt-secret-bench/**"
  - "docs/research/prompt-secret-holdout/**"
